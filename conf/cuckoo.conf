# ── cuckoo.conf content (relevant sections) ─────────────────────────
[cuckoo]
delete_original = no
machinery = virtualbox
freespace = 5000

[resultserver]
# CAPE result server — sandbox VMs connect back to this IP/port 
# ip = # MGW CAPE-Manage interface
ip = 10.0.0.10 
port = 2042

[processing]
analysis_size_limit = 536870912
freespace_processing = 512

[database]
connection =

[timeouts]
default = 120
critical = 60
vm_state = 300


